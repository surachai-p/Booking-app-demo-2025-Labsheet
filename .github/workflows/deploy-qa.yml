name: Deploy to QA

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  qa-test:
    name: Test QA candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install and migrate backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_qa
        run: |
          npm ci
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.QA_BACKEND_URL }}
        run: |
          npm ci
          npm run lint
          npm run build

  deploy-qa:
    name: Deploy QA environment
    runs-on: ubuntu-latest
    needs: qa-test
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Deploy frontend preview
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel --token "$VERCEL_TOKEN" --yes
      - name: Trigger Render QA deployment
        env:
          RENDER_QA_DEPLOY_HOOK: ${{ secrets.RENDER_QA_DEPLOY_HOOK }}
        run: curl --fail --show-error --request POST "$RENDER_QA_DEPLOY_HOOK"
